# DX-TwinOS Continuous Openness & PoF Compliance Pipeline (VFOSSA 50/50)
# Tự động kiểm tra:
#   1. Nhãn bản quyền SPDX Apache-2.0 trên toàn bộ file mã nguồn/cấu hình
#   2. Chính sách Zero-Bundling & cấm file nhị phân/nén trong kho Git
#   3. Kiểm tra tính hợp lệ (Lint & Validate) của cấu hình Docker Compose Tầng 1
# =============================================================================

name: PoF Open Source Compliance & GitOps Audit

on:
  push:
    branches: ["main", "feat/**", "fix/**"]
  pull_request:
    branches: ["main"]

jobs:
  spdx-and-zero-bundling-audit:
    name: "PoF Audit: SPDX Headers & Zero-Bundling"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Core Legal Governance Files (PoF Criterion 1, 2, 6)
        run: |
          echo "=== [1/4] Checking Mandatory Open Source Governance Files ==="
          for required_file in LICENSE NOTICE README.md CHANGELOG.md CONTRIBUTING.md .gitignore .env.example; do
            if [ ! -f "$required_file" ]; then
              echo "::error::Missing required PoF governance file: $required_file"
              exit 1
            fi
            echo "✔ Found $required_file"
          done

      - name: Enforce Zero-Bundling & No Binary Artifacts (PoF Criterion 3)
        run: |
          echo "=== [2/4] Checking Zero-Bundling & Forbidden Binary Files ==="
          for forbidden_dir in external vendor third_party node_modules; do
            if [ -d "$forbidden_dir" ]; then
              echo "::error::Zero-Bundling violation! Forbidden directory detected: $forbidden_dir"
              exit 1
            fi
          done

          FORBIDDEN_BINS=$(find . -path ./.git -prune -o -type f \( \
            -name "*.zip" -o -name "*.rar" -o -name "*.7z" -o \
            -name "*.exe" -o -name "*.dll" -o -name "*.jar" -o \
            -name "*.so" -o -name "*.dylib" -o -name "*.class" \
          \) -print)

          if [ -n "$FORBIDDEN_BINS" ]; then
            echo "::error::Forbidden binary/archive files found in repository:"
            echo "$FORBIDDEN_BINS"
            exit 1
          fi
          echo "✔ Zero-Bundling & Binary check passed!"

      - name: Verify SPDX-License-Identifier Headers (PoF Criterion 2)
        run: |
          echo "=== [3/4] Auditing SPDX-License-Identifier: Apache-2.0 Headers ==="
          MISSING_SPDX=0
          while IFS= read -r -d '' file; do
            if ! grep -q "SPDX-License-Identifier: Apache-2.0" "$file"; then
              echo "::error file=$file::Missing 'SPDX-License-Identifier: Apache-2.0' header in $file"
              MISSING_SPDX=1
            fi
          done < <(find . -path ./.git -prune -o -type f \( \
            -name "*.py" -o -name "*.sql" -o -name "*.yml" -o -name "*.yaml" -o \
            -name "*.json" -o -name "*.md" -o -name "Makefile" -o -name ".gitignore" -o \
            -name ".env.example" \
          \) -print0)

          if [ "$MISSING_SPDX" -ne 0 ]; then
            exit 1
          fi
          echo "✔ All source and configuration files carry valid SPDX Apache-2.0 headers!"

      - name: Lint Tier-1 Headless PaaS Docker Compose Configuration
        run: |
          echo "=== [4/4] Validating Docker Compose & Environment Template ==="
          cp .env.example .env
          docker compose -f deploy/docker-compose.yml config -q
          echo "✔ deploy/docker-compose.yml syntax and variable interpolation verified!"
